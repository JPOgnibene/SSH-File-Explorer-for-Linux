name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 on Linux needs webkit2gtk 4.1 and related system libraries.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ssh-file-explorer/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssh-file-explorer/src-tauri

      - name: Install frontend dependencies
        working-directory: ssh-file-explorer
        run: npm ci

      - name: Build Tauri app
        working-directory: ssh-file-explorer
        run: npx tauri build

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ssh-file-explorer/src-tauri/target/release/ssh-file-explorer.exe
            ssh-file-explorer/src-tauri/target/release/bundle/msi/*.msi
            ssh-file-explorer/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ssh-file-explorer/src-tauri/target/release/bundle/appimage/*.AppImage
            ssh-file-explorer/src-tauri/target/release/bundle/deb/*.deb
            ssh-file-explorer/src-tauri/target/release/bundle/rpm/*.rpm
