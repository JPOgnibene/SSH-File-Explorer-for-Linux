name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ssh-file-explorer/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssh-file-explorer/src-tauri

      - name: Install frontend dependencies
        working-directory: ssh-file-explorer
        run: npm ci

      - name: Build Tauri app
        working-directory: ssh-file-explorer
        run: npx tauri build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ssh-file-explorer/src-tauri/target/release/ssh-file-explorer.exe
            ssh-file-explorer/src-tauri/target/release/bundle/msi/*.msi
            ssh-file-explorer/src-tauri/target/release/bundle/nsis/*.exe
