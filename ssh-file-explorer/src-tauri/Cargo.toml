[package]
name = "ssh-file-explorer"
version = "1.2.0"
description = "Browse and manage remote Linux files over SSH"
authors = ["JPOgnibene"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssh_file_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.61.2", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-keys = "0.49.2"
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1.89"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
dirs = "6"
russh-sftp = "2.3.0"
tauri-plugin-dialog = "2.7.1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

